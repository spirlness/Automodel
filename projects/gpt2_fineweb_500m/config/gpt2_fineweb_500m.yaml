# Minimal GPT-2 (124M) pretraining recipe on FineWeb.
# This intentionally uses only baseline AutoModel components: DDP, AdamW,
# SDPA, and the regular masked cross-entropy loss.

recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 16
  local_batch_size: 8
  ckpt_every_steps: 500
  val_every_steps: 100
  num_epochs: 1
  # floor(500_000_000 / (16 * 1024)); the remaining 9,472 tokens cannot form a full global batch.
  max_steps: 30517

dist_env:
  backend: nccl
  timeout_minutes: 2

# Enable TensorFloat-32 where the GPU supports it.
performance:
  float32_matmul_precision: high

# Model: Modern nanoGPT (RoPE + RMSNorm + SwiGLU + Zero-Bias + 50304 Vocab)
model:
  _target_: nemo_automodel.components.models.gpt2.build_gpt2_model
  vocab_size: 50304    # Hardware Tensor-Core aligned multiple of 64
  n_positions: 1024
  n_embd: 768
  n_layer: 12
  n_head: 12
  bias: false          # Pure dense GEMMs without bias addition epilogues
  use_rope: true       # Rotary Position Embeddings
  norm_type: "rmsnorm" # RMSNorm for reduced memory traffic
  mlp_type: "swiglu"   # SwiGLU gated FFN for enhanced capacity & faster convergence
  dropout: 0.0         # Pretraining best practice: zero dropout
  attn_implementation: "sdpa"  # This model uses PyTorch SDPA, not the flash-attn package directly.
  torch_dtype: bfloat16

# Dataset: FineWeb 500M token zero-copy memory-mapped binary shards
dataset:
  _target_: nemo_automodel.components.datasets.llm.nanogpt_dataset.NanogptDataset
  file_pattern: "projects/gpt2_fineweb_500m/data/fineweb_500M_max_tokens_500M/dataset.bin"
  seq_len: 1024
  shuffle_files: true
  align_to_bos: false

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  shuffle: false
  collate_fn: nemo_automodel.components.datasets.utils.default_collater

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

# Gradient Clipping
clip_grad_norm:
  max_norm: 1.0

optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0006
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1

# Learning Rate Scheduler: Cosine Decay with 200-step Warmup
lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 200
  min_lr: 0.00006

# Baseline data-parallel training. No FSDP2 or torch.compile is required.
distributed:
  strategy: ddp

# Checkpointing
checkpoint:
  enabled: true
  checkpoint_dir: projects/gpt2_fineweb_500m/checkpoints/gpt2_fineweb_500m/
  restore_from: null
  model_save_format: torch_save
  save_consolidated: false
  max_recent_checkpoints: 3
